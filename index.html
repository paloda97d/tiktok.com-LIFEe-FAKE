<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok Live Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #000;
        color: #fff;
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-in { animation: slideIn 0.2s ease-out forwards; }
    @keyframes floatUp {
        0% { transform: translateY(0px) scale(0.6); opacity: 0; }
        20% { opacity: 1; transform: translateY(-40px) scale(1.1); }
        100% { transform: translateY(-280px) scale(1.3); opacity: 0; }
    }
    .floating-heart {
        position: absolute;
        bottom: 70px;
        right: 20px;
        animation: floatUp 2.2s ease-out forwards;
        pointer-events: none;
    }
    @keyframes giftPop {
        0% { transform: scale(0.6); opacity: 0; }
        70% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }
    .animate-gift { animation: giftPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards; }
</style>
</head>
<body class="h-screen w-screen flex flex-col justify-between relative overflow-hidden bg-black">

    <!-- Cámara en Tiempo Real (Fondo de Pantalla Completa) -->
    <div class="absolute inset-0 z-0 bg-black overflow-hidden flex items-center justify-center">
        <video id="cameraStream" autoplay playsinline muted class="h-full w-full object-cover"></video>
    </div>

    <!-- Barra Superior Exacta TikTok (Sin Ligas ni Trofeos) -->
    <div class="relative z-10 pt-12 px-3 flex justify-between items-center bg-gradient-to-b from-black/70 via-black/20 to-transparent pb-3">
        <!-- Izquierda: Perfil, Nombre, Likes y Botón Unirse -->
        <div class="flex items-center space-x-2">
            <div class="flex items-center bg-black/40 backdrop-blur-md rounded-full p-1 pr-3 border border-white/10 space-x-2">
                <div class="w-8 h-8 rounded-full overflow-hidden border border-white/20">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" class="w-full h-full object-cover" alt="Avatar">
                </div>
                <div class="text-xs">
                    <div class="flex items-center space-x-1">
                        <span id="displayUsername" class="font-bold text-white">Yanina</span>
                        <span class="text-xs">🍭</span>
                    </div>
                    <div class="flex items-center text-[10px] text-gray-300">
                        <i class="fa-solid fa-heart text-pink-500 text-[8px] mr-0.5"></i> <span id="totalLikes">129.6K</span>
                    </div>
                </div>
            </div>
            <!-- Botón Naranja Unirse -->
            <button class="bg-gradient-to-r from-amber-500 to-orange-500 text-white text-xs font-bold px-3.5 py-1.5 rounded-full shadow-md flex items-center space-x-1">
                <i class="fa-solid fa-user-plus text-[10px]"></i>
                <span>Unirse</span>
            </button>
        </div>

        <!-- Derecha: Espectadores, Configuración y X -->
        <div class="flex items-center space-x-2">
            <!-- Espectadores en línea -->
            <div class="flex items-center bg-black/40 backdrop-blur-md rounded-full px-2.5 py-1 border border-white/10 text-xs space-x-1.5">
                <div class="flex -space-x-2 overflow-hidden">
                    <div class="inline-block h-4 w-4 rounded-full ring-1 ring-black bg-purple-500 text-[8px] flex items-center justify-center font-bold">👤</div>
                    <div class="inline-block h-4 w-4 rounded-full ring-1 ring-black bg-blue-500 text-[8px] flex items-center justify-center font-bold">👤</div>
                </div>
                <span id="viewerCount" class="font-semibold text-xs">71</span>
            </div>
            <!-- Botón Ajustes (⚙️) -->
            <button onclick="toggleSettingsModal()" class="w-7 h-7 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white text-xs">
                <i class="fa-solid fa-gear"></i>
            </button>
            <!-- Botón Cerrar Live (X) -->
            <button onclick="endLive()" class="w-7 h-7 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Contenedor de Regalos Animados (Lado Izquierdo) -->
    <div id="giftContainer" class="absolute top-28 left-3 z-20 space-y-2 pointer-events-none w-72"></div>

    <!-- Contenedor de Corazones Flotantes (Lado Derecho Inferior) -->
    <div id="heartsContainer" class="absolute inset-0 z-10 pointer-events-none overflow-hidden"></div>

    <!-- Interfaz Inferior (Chat Estilo TikTok Real + Barra de Comentarios) -->
    <div class="relative z-10 p-3 flex flex-col space-y-2.5 bg-gradient-to-t from-black/90 via-black/40 to-transparent pb-6">
        <!-- Chat Flotante -->
        <div id="chatContainer" class="h-48 overflow-y-auto no-scrollbar flex flex-col space-y-2">
            <div class="bg-black/30 backdrop-blur-sm self-start rounded-xl px-2.5 py-1.5 text-xs max-w-[90%] border border-white/5">
                <span class="text-blue-300 font-semibold">◆ 26 Javi se unió</span>
            </div>
        </div>

        <!-- Barra de Escribir y Botones Inferiores -->
        <div class="flex items-center space-x-2 pt-1">
            <div class="bg-black/60 backdrop-blur-md border border-white/10 rounded-full flex-1 px-4 py-2.5 text-xs text-gray-300 flex items-center justify-between">
                <span class="text-gray-400">Escribe algo...</span>
            </div>
            <!-- Botón Cambio de Cámara -->
            <button onclick="switchCamera()" class="bg-black/60 backdrop-blur-md border border-white/10 text-white w-10 h-10 rounded-full flex items-center justify-center text-sm shadow-md" title="Cambiar Cámara">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <!-- Botón Rosa -->
            <button class="bg-black/60 backdrop-blur-md border border-white/10 text-white w-10 h-10 rounded-full flex items-center justify-center text-sm">
                <span class="text-base">🌹</span>
            </button>
            <!-- Botón Regalo -->
            <button onclick="triggerGift()" class="bg-gradient-to-tr from-pink-600 to-purple-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition">
                <i class="fa-solid fa-gift text-sm"></i>
            </button>
            <!-- Botón Corazón / Like -->
            <button onclick="sendHeart()" class="bg-gradient-to-tr from-red-600 to-pink-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition">
                <i class="fa-solid fa-heart text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Modal de Configuración Avanzada -->
    <div id="settingsModal" class="absolute inset-0 z-50 bg-black/80 backdrop-blur-lg hidden flex items-center justify-center p-5">
        <div class="bg-zinc-900 border border-white/10 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl text-white">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 class="font-bold text-base flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-pink-500"></i>
                    <span>Ajustes del Live Falso</span>
                </h3>
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Cambiar Usuario -->
            <div class="space-y-1">
                <label class="text-xs text-gray-400 font-medium">Nombre de Usuario:</label>
                <input type="text" id="inputUsername" value="Yanina" class="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500">
            </div>

            <!-- Rango de Espectadores -->
            <div class="grid grid-cols-2 gap-2">
                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-medium">Espectadores Mín:</label>
                    <input type="number" id="inputMinViewers" value="50" class="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-medium">Espectadores Máx:</label>
                    <input type="number" id="inputMaxViewers" value="10000" class="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500">
                </div>
            </div>

            <!-- Botón Encender / Apagar Live -->
            <div class="pt-2 flex space-x-2">
                <button onclick="applySettings()" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-lg transition">
                    Guardar y Aplicar
                </button>
                <button onclick="toggleLiveState()" id="liveStateBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow-lg transition">
                    Finalizar Live
                </button>
            </div>
        </div>
    </div>

    <!-- Pantalla de Resumen al Finalizar Live -->
    <div id="endScreen" class="absolute inset-0 z-50 bg-black hidden flex flex-col items-center justify-center p-6 text-center space-y-4">
        <div class="w-16 h-16 rounded-full bg-pink-600/20 flex items-center justify-center text-pink-500 text-2xl mb-2">
            <i class="fa-solid fa-broadcast-tower"></i>
        </div>
        <h2 class="text-xl font-bold">La transmisión en vivo ha terminado</h2>
        <p class="text-xs text-gray-400">Gracias por transmitir en TikTok Live.</p>
        <div class="bg-zinc-900 border border-white/10 rounded-xl p-4 w-full max-w-xs space-y-2 text-xs">
            <div class="flex justify-between"><span class="text-gray-400">Total Espectadores:</span> <span id="summaryViewers" class="font-bold">0</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Diamantes Recibidos:</span> <span id="summaryDiamonds" class="font-bold text-yellow-400">0</span></div>
        </div>
        <button onclick="location.reload()" class="bg-white text-black font-bold px-6 py-2.5 rounded-full text-xs shadow-lg mt-4">
            Volver a Iniciar
        </button>
    </div>

    <script>
        let isLiveActive = true;
        let currentFacingMode = "user";
        let minViewers = 50;
        let maxViewers = 10000;
        let currentViewers = 71;
        let totalDiamondsCount = 1285;
        let likeCountNum = 129600;

        // Inicializar Cámara Frontal del iPhone en Tiempo Real
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode }, 
                    audio: false 
                });
                document.getElementById('cameraStream').srcObject = stream;
            } catch (error) {
                console.error("Error al acceder a la cámara:", error);
            }
        }
        initCamera();

        // Cambiar Cámara Frontal / Trasera
        async function switchCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            await initCamera();
        }

        // Abrir / Cerrar Modal de Ajustes
        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        // Aplicar Configuración de Ajustes
        function applySettings() {
            const usernameInput = document.getElementById('inputUsername').value;
            document.getElementById('displayUsername').innerText = usernameInput || "Yanina";
            
            minViewers = parseInt(document.getElementById('inputMinViewers').value) || 10;
            maxViewers = parseInt(document.getElementById('inputMaxViewers').value) || 1000;
            if(currentViewers < minViewers) currentViewers = minViewers;
            
            toggleSettingsModal();
        }

        // Finalizar Transmisión
        function endLive() {
            isLiveActive = false;
            // Detener cámara
            const videoElem = document.getElementById('cameraStream');
            if(videoElem.srcObject) {
                videoElem.srcObject.getTracks().forEach(track => track.stop());
            }
            document.getElementById('summaryViewers').innerText = currentViewers.toLocaleString();
            document.getElementById('summaryDiamonds').innerText = totalDiamondsCount.toLocaleString();
            document.getElementById('endScreen').classList.remove('hidden');
        }

        function toggleLiveState() {
            endLive();
        }

        // Datos del Chat y Bots
        const usernames = ["carlos_fx", "andrea_beauty", "pedro.picapiedra", "juancho_10", "sofia_fit", "rorro_x", "claudia_chile", "ignacio_sk8", "el fantástico", "FUSER"];
        const comments = ["Hola", "bandido de Ana Barbara cumbia", "roxett habla el corazón esa canción", "Jajaja csm 😂", "Saludos desde Maipú!", "Hermoso bro 🔥", "10/10", "A darle con todo 💪", "Me encantas ❤️", "Holaa wapa 👋", "Wenaa sipo ✨", "🔥🔥🔥", "Jajaja wena", "Tremendo directo 👏", "😍😍", "Salu2 rey 👑"];

        const chatContainer = document.getElementById('chatContainer');
        const viewerCountElem = document.getElementById('viewerCount');

        function addComment() {
            if (!isLiveActive) return;
            const user = usernames[Math.floor(Math.random() * usernames.length)];
            const isJoin = Math.random() < 0.25;
            
            const div = document.createElement('div');
            div.className = "bg-black/30 backdrop-blur-sm self-start rounded-xl px-2.5 py-1.5 text-xs max-w-[90%] border border-white/5 animate-slide-in flex flex-col";
            
            if (isJoin) {
                const level = Math.floor(Math.random() * 30) + 1;
                div.innerHTML = `<span class="text-blue-300 font-semibold">◆ ${level} ${user} se unió</span>`;
            } else {
                const text = comments[Math.floor(Math.random() * comments.length)];
                const hasLevel = Math.random() < 0.4;
                const levelBadge = hasLevel ? `<span class="bg-blue-600 text-white px-1 rounded text-[9px] font-bold mr-1">◆ ${Math.floor(Math.random() * 25) + 1}</span>` : '';
                
                div.innerHTML = `
                    <span class="text-gray-400 font-medium text-[11px] mb-0.5 flex items-center">${levelBadge}${user}</span>
                    <span class="text-white text-xs">${text}</span>
                `;
            }
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (chatContainer.children.length > 30) {
                chatContainer.removeChild(chatContainer.children[0]);
            }
        }

        // Animación de Corazones (Likes)
        function sendHeart() {
            if (!isLiveActive) return;
            const heartsContainer = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.className = 'floating-heart text-red-500 text-2xl';
            const icons = ['❤️', '💖', '💗', '❤️‍🔥'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            heart.style.right = (Math.random() * 40 + 10) + 'px';
            heartsContainer.appendChild(heart);
            
            likeCountNum += Math.floor(Math.random() * 5) + 1;
            document.getElementById('totalLikes').innerText = (likeCountNum / 1000).toFixed(1) + 'K';

            setTimeout(() => { heart.remove(); }, 2200);
        }

        // Sistema de Regalos Realista
        const giftList = [
            { name: "Rosa", icon: "🌹", coins: 1, color: "from-pink-500 to-rose-600" },
            { name: "GG", icon: "🎮", coins: 5, color: "from-indigo-500 to-purple-600" },
            { name: "TikTok", icon: "🎵", coins: 1, color: "from-cyan-500 to-blue-600" },
            { name: "Anillo", icon: "💍", coins: 300, color: "from-purple-500 to-indigo-600" },
            { name: "Galaxia", icon: "🌌", coins: 1999, color: "from-purple-600 via-pink-600 to-blue-600" },
            { name: "León", icon: "🦁", coins: 29999, color: "from-yellow-500 via-orange-600 to-amber-700" },
            { name: "Ballena", icon: "🐋", coins: 21500, color: "from-blue-600 via-cyan-500 to-teal-600" }
        ];

        function triggerGift() {
            if (!isLiveActive) return;
            const user = usernames[Math.floor(Math.random() * usernames.length)];
            const gift = giftList[Math.floor(Math.random() * giftList.length)];
            const giftContainer = document.getElementById('giftContainer');

            totalDiamondsCount += gift.coins;

            const gDiv = document.createElement('div');
            gDiv.className = `flex items-center bg-gradient-to-r ${gift.color} p-1.5 pr-4 rounded-full shadow-2xl text-xs space-x-2.5 w-max animate-gift border border-white/20`;
            gDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white font-bold text-sm">
                    👤
                </div>
                <div>
                    <p class="font-bold text-white text-[11px] leading-tight">${user}</p>
                    <p class="text-[10px] text-white/90 leading-tight">Envío ${gift.name} ${gift.icon} <span class="bg-black/30 px-1.5 py-0.2 rounded text-[9px] font-bold ml-1">x1</span></p>
                </div>
            `;

            giftContainer.appendChild(gDiv);
            setTimeout(() => { gDiv.remove(); }, 4500);
            sendHeart();
        }

        // Intervalos automáticos ajustados al rango configurado
        setInterval(addComment, 1800);
        setInterval(() => {
            if(Math.random() > 0.35) triggerGift();
        }, 4000);
        setInterval(() => {
            if(Math.random() > 0.5) sendHeart();
        }, 1200);
        setInterval(() => {
            if (!isLiveActive) return;
            const change = Math.floor(Math.random() * 15) - 7;
            currentViewers += change;
            if(currentViewers < minViewers) currentViewers = minViewers;
            if(currentViewers > maxViewers) currentViewers = maxViewers;
            viewerCountElem.innerText = currentViewers.toLocaleString();
        }, 3000);
    </script>
</body>
</html>
